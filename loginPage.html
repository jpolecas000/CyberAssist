<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to your CyberAssist Account</title>
    <link rel="icon" href="CyberAssist Logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav_bar">
      <a href="index.html">Home</a>
      <a href="aboutUs.html">About Us</a>
      <a href="help.html">Help</a>
      <a href="learn.html">Learn</a>
      <a href="loginPage.html">Login/Sign Up</a>
      <a href="appointmentForm.html">Book an Appointment</a>
    </div>

    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Please log in to your account</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
                <span class="error-message" id="usernameError"></span>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit" id="loginBtn">Log In</button>
            
            <p class="success-message" id="successMessage"></p>
        </form>
        <a href="signUp.html" class="signup-link">Don't have an account? Sign Up</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
